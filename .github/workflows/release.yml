name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            archive_name: portal-cli-linux-amd64.tar.gz
          - os: macos-latest
            target: darwin-arm64
            archive_name: portal-cli-darwin-arm64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Build Binary
        run: |
          cd cli
          bun install --frozen-lockfile
          bun build --compile src/index.ts --outfile portal
          tar -czvf "../${{ matrix.archive_name }}" portal

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

  build-app-macos:
    name: Build Flutter macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          cache: true

      - name: Build macOS
        run: |
          chmod +x tool/build_macos.sh
          ./tool/build_macos.sh --dest "$GITHUB_WORKSPACE"

      - name: Upload Artifact DMG
        uses: actions/upload-artifact@v4
        with:
          name: Portal-macos-dmg
          path: Portal-*-macos.dmg

      - name: Upload Artifact ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Portal-macos-zip
          path: Portal-*-macos.zip

  build-app-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          cache: true

      - name: Build APK
        run: |
          chmod +x tool/build_apk.sh
          ./tool/build_apk.sh --dest "$GITHUB_WORKSPACE"

      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: Portal-universal-apk
          path: Portal-*-universal.apk

  publish:
    name: Publish GitHub Release
    needs: [build-cli, build-app-macos, build-app-apk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
