name: portal
description: "Portal — minimal, local-first links manager."
publish_to: 'none'

version: 0.3.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  file_picker: ^10.3.10
  html: ^0.15.6
  http: ^1.6.0
  path_provider: ^2.1.6
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  watcher: ^1.1.2
  yaml: ^3.1.3
  receive_sharing_intent: ^1.9.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: UndefinedMedium
      fonts:
        - asset: assets/fonts/undefined-medium.ttf
    - family: Pixelarticons
      fonts:
        - asset: assets/fonts/pixelart-icons.ttf
